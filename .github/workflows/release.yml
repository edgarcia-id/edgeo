name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to finish (for example v0.1.3)
        required: true
        type: string
      publish_npm:
        description: Publish to npm before completing the remaining release steps
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag and package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TARGET_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $TARGET_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Update npm CLI for trusted publishing
        run: npm install --global npm@11.15.0
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - run: mkdir -p release && npm pack --pack-destination release
      - name: Publish package to npm
        if: ${{ github.event_name == 'push' || inputs.publish_npm }}
        run: npm publish --access public
      - name: Wait for npm package visibility
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 16); do
            if npm view "edgeo-mcp@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "edgeo-mcp@$PACKAGE_VERSION is visible on npm"
              exit 0
            fi
            echo "Waiting for edgeo-mcp@$PACKAGE_VERSION to become visible on npm (attempt $attempt/16)"
            sleep 15
          done
          echo "edgeo-mcp@$PACKAGE_VERSION did not become visible on npm in time"
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify MCP Registry publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the Official MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata to the Official MCP Registry
        run: ./mcp-publisher publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TARGET_TAG already exists"
          else
            gh release create "$TARGET_TAG" release/*.tgz --generate-notes
          fi
